[package]
name = "delta"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
delta-engine = { version = "0.1.0", path = "../engine" }
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-tungstenite = "0.30.0"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "server-graceful"] }
ipnet = { version = "2.12.2", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = "1.29.0"

[dev-dependencies]
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
solana-client = "~4.2.2"
solana-commitment-config = "3.1"
solana-pubsub-client = "~4.2.2"
solana-sdk = "4.0.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
